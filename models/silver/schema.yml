version: 2

models:
  - name: pasajeros
    description: "Pasajeros por aeropuerto, mes y tipo de tráfico. Fuente: AENA datos abiertos."
    columns:
      - name: iata_code
        description: "Código IATA del aeropuerto. Puede ser nulo en helipuertos y aeródromos menores."
      - name: mes_anio
        tests:
          - not_null
      - name: tipo_trafico
        tests:
          - not_null
      - name: total_pasajeros
        tests:
          - not_null
      - name: _inserted_at
        description: "Fecha y hora de inserción del registro en Silver."
        tests:
          - not_null

  - name: operaciones
    description: "Operaciones por aeropuerto y mes."
    columns:
      - name: iata_code
        description: "Código IATA del aeropuerto."
      - name: mes_anio
        tests:
          - not_null
      - name: total_operaciones
        tests:
          - not_null
      - name: _inserted_at
        description: "Fecha y hora de inserción del registro en Silver."
        tests:
          - not_null

  - name: mercancias
    description: "Mercancías por aeropuerto, mes y tipo de carga."
    columns:
      - name: iata_code
        description: "Código IATA del aeropuerto."
      - name: mes_anio
        tests:
          - not_null
      - name: tipo_carga
        tests:
          - not_null
      - name: _inserted_at
        description: "Fecha y hora de inserción del registro en Silver."
        tests:
          - not_null

  - name: vuelos
    description: "Vuelos con puntualidad y ocupación."
    columns:
      - name: vuelo_id
        tests:
          - not_null
          - unique
      - name: codigo_aerolinea
        tests:
          - not_null
      - name: fecha_vuelo
        tests:
          - not_null
      - name: estado_vuelo
        tests:
          - not_null
      - name: _inserted_at
        description: "Fecha y hora de inserción del registro en Silver."
        tests:
          - not_null

  - name: aeropuertos
    description: "Catálogo de aeropuertos."
    columns:
      - name: iata_code
        tests:
          - not_null
          - unique
      - name: nombre
        tests:
          - not_null
      - name: _inserted_at
        description: "Fecha y hora de inserción del registro en Silver."
        tests:
          - not_null

  - name: aerolineas
    description: "Catálogo de aerolíneas."
    columns:
      - name: codigo_iata
        tests:
          - not_null
          - unique
      - name: nombre_comercial
        tests:
          - not_null
      - name: _inserted_at
        description: "Fecha y hora de inserción del registro en Silver."
        tests:
          - not_null

  - name: rutas
    description: "Rutas entre aeropuertos."
    columns:
      - name: ruta_id
        tests:
          - not_null
      - name: aeropuerto_origen
        tests:
          - not_null
      - name: aeropuerto_destino
        tests:
          - not_null
      - name: _inserted_at
        description: "Fecha y hora de inserción del registro en Silver."
        tests:
          - not_null